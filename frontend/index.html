<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NativeChat — Masuk &amp; Daftar</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <!-- Layar Auth -->
        <section id="auth-view" class="card">
            <h1>NativeChat</h1>
            <p class="subtitle">Tahap 1 — Manajemen Akun (Pure HTML, CSS, JS)</p>

            <div class="tabs">
                <button type="button" class="tab-btn active" data-tab="login">Masuk</button>
                <button type="button" class="tab-btn" data-tab="register">Daftar</button>
            </div>

            <div id="auth-alert" class="alert hidden"></div>

            <form id="login-form" class="form">
                <label>
                    Nomor HP
                    <input type="text" name="phone" placeholder="081234567890" required>
                </label>
                <label>
                    Kata Sandi
                    <input type="password" name="password" placeholder="Minimal 6 karakter" required>
                </label>
                <button type="submit" class="btn-primary">Masuk</button>
            </form>

            <form id="register-form" class="form hidden">
                <label>
                    Nama Lengkap
                    <input type="text" name="name" placeholder="Budi Santoso" required>
                </label>
                <label>
                    Nomor HP
                    <input type="text" name="phone" placeholder="081234567890" required>
                </label>
                <label>
                    Kata Sandi
                    <input type="password" name="password" placeholder="Minimal 6 karakter" required>
                </label>
                <button type="submit" class="btn-primary">Daftar Akun</button>
            </form>
        </section>

        <!-- Layar Setelah Login -->
        <section id="dashboard-view" class="card hidden">
            <h2>Akun Aktif</h2>
            <p class="subtitle">Anda berhasil masuk menggunakan JWT.</p>

            <div class="profile-box">
                <div><span>ID:</span> <strong id="me-id">-</strong></div>
                <div><span>Nama:</span> <strong id="me-name">-</strong></div>
                <div><span>No. HP:</span> <strong id="me-phone">-</strong></div>
            </div>

            <div class="actions">
                <button type="button" id="btn-logout" class="btn-secondary">Keluar</button>
                <button type="button" id="btn-delete-account" class="btn-danger">Hapus Akun</button>
            </div>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
