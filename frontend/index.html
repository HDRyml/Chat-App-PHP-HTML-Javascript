<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NativeChat — Tahap 1</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <!-- Layar Auth -->
        <section id="auth-view" class="card">
            <h1>NativeChat</h1>
            <p class="subtitle">Tahap 1 — Akun &amp; Kontak (Pure HTML, CSS, JS)</p>

            <div class="tabs">
                <button type="button" class="tab-btn active" data-tab="login">Masuk</button>
                <button type="button" class="tab-btn" data-tab="register">Daftar</button>
            </div>

            <div id="auth-alert" class="alert hidden"></div>

            <form id="login-form" class="form">
                <label>
                    Nomor HP
                    <input type="text" name="phone" placeholder="081234567890" required>
                </label>
                <label>
                    Kata Sandi
                    <input type="password" name="password" placeholder="Minimal 6 karakter" required>
                </label>
                <button type="submit" class="btn-primary">Masuk</button>
            </form>

            <form id="register-form" class="form hidden">
                <label>
                    Nama Lengkap
                    <input type="text" name="name" placeholder="Budi Santoso" required>
                </label>
                <label>
                    Nomor HP
                    <input type="text" name="phone" placeholder="081234567890" required>
                </label>
                <label>
                    Kata Sandi
                    <input type="password" name="password" placeholder="Minimal 6 karakter" required>
                </label>
                <button type="submit" class="btn-primary">Daftar Akun</button>
            </form>
        </section>

        <!-- Layar Setelah Login -->
        <section id="dashboard-view" class="card dashboard-card hidden">
            <header class="dash-header">
                <div>
                    <h2 id="me-name">-</h2>
                    <p class="subtitle" id="me-phone">-</p>
                </div>
                <div class="header-actions">
                    <button type="button" id="btn-logout" class="btn-secondary">Keluar</button>
                    <button type="button" id="btn-delete-account" class="btn-danger">Hapus Akun</button>
                </div>
            </header>

            <hr class="divider">

            <h3>Kontak Saya</h3>
            <div id="contact-alert" class="alert hidden"></div>

            <form id="contact-form" class="form contact-form">
                <input type="hidden" id="contact-edit-id" value="">
                <div class="contact-inputs">
                    <input type="text" id="contact-name" placeholder="Nama kontak" required>
                    <input type="text" id="contact-phone" placeholder="Nomor HP" required>
                </div>
                <div class="actions">
                    <button type="submit" id="contact-submit-btn" class="btn-primary">Tambah Kontak</button>
                    <button type="button" id="contact-cancel-btn" class="btn-secondary hidden">Batal</button>
                </div>
            </form>

            <ul id="contact-list" class="contact-list"></ul>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
